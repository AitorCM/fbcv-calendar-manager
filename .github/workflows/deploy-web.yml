name: Desplegar web en Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbcv-web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Comprobar credencial de despliegue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Falta el secret CLOUDFLARE_API_TOKEN (Workers Editor).'
            exit 1
          fi
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.19'
          enable-cache: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            cloudflare/package-lock.json
      - name: Instalar dependencias fijadas
        run: |
          uv sync --locked --python 3.12
          npm ci --prefix frontend --no-audit --no-fund
          npm ci --prefix cloudflare --no-audit --no-fund
      - name: Ejecutar pruebas
        run: |
          uv run python -m unittest discover -s tests -v
          npm test --prefix frontend
      - name: Validar compilación, tipos y empaquetado
        run: |
          npm run build --prefix frontend
          npm run check --prefix cloudflare
          npm run dry-run --prefix cloudflare
      - name: Publicar Worker y web
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CI: 'true'
        run: npm run deploy -- --message "$GITHUB_SHA"
      - name: Comprobar web y API publicadas
        run: |
          curl --fail --retry 3 --silent --show-error --output /dev/null 'https://fbcv-calendar-manager.aitor935.workers.dev/'
          curl --fail --retry 3 --silent --show-error --output /dev/null 'https://fbcv-calendar-manager.aitor935.workers.dev/api/meta?season=2026'
          echo "Web y Worker publicados desde el commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
