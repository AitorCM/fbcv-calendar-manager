<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        var theme;
        try {
          theme = localStorage.getItem("fbcv-theme");
        } catch (_) {}
        if (theme !== "light" && theme !== "dark")
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta name="theme-color" content="#16324b" />
    <meta
      name="description"
      content="Consulta los equipos y calendarios de tu club de baloncesto, organizados por competición y jornada."
    />
    <title>En pista · Calendarios FBCV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
