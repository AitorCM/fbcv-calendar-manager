[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fbcv-calendar-manager"
version = "0.1.0"
description = "Calendarios FBCV: crawler verificable de temporada y almacenamiento SQLite"
requires-python = ">=3.12"
dependencies = ["scrapy>=2.13,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
fbcv-crawl = "fbcv_calendar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fbcv_calendar"]
